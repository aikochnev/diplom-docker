name: Build and deploy

'on':
  push:
    branches:
      - main

env:
  REGISTRY_HOST: cr.yandex
  REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
  IMAGE_NAME: my-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate in Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_CI_KEY_JSON }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY_HOST }}/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY_HOST }}/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to web-b
        id: deploy_web_b
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.WEB_B_IP }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -eu

            IMAGE="${{ env.REGISTRY_HOST }}/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

            TOKEN=$(curl -fsS \
              -H "Metadata-Flavor: Google" \
              http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')

            echo "$TOKEN" | docker login \
              --username iam \
              --password-stdin \
              "${{ env.REGISTRY_HOST }}"

            docker pull "$IMAGE"

            docker rm -f diplom-app 2>/dev/null || true

            docker run -d \
              --name diplom-app \
              --restart unless-stopped \
              -p 80:80 \
              "$IMAGE"

            docker image prune -f

            curl -fsS http://localhost/ > /dev/null

      - name: Report web-b deployment failure
        if: steps.deploy_web_b.outcome == 'failure'
        run: echo "web-b deployment failed; continuing with web-d"



      - name: Deploy to web-d
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.WEB_D_IP }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -eu

            IMAGE="${{ env.REGISTRY_HOST }}/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

            TOKEN=$(curl -fsS \
              -H "Metadata-Flavor: Google" \
              http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')

            echo "$TOKEN" | docker login \
              --username iam \
              --password-stdin \
              "${{ env.REGISTRY_HOST }}"

            docker pull "$IMAGE"

            docker rm -f diplom-app 2>/dev/null || true

            docker run -d \
              --name diplom-app \
              --restart unless-stopped \
              -p 80:80 \
              "$IMAGE"

            docker image prune -f

            curl -fsS http://localhost/ > /dev/null

      - name: Deployment summary
        if: always()
        run: |
          echo "web-b deployment was allowed to fail"
          echo "web-d deployment is the required target"