<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps диплом</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #e2e8f0;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 720px;
      padding: 48px;
      text-align: center;
      border: 1px solid #334155;
      border-radius: 16px;
      background: #1e293b;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin-top: 0;
      color: #38bdf8;
    }

    p {
      font-size: 1.2rem;
    }

    .status {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 16px;
      border-radius: 999px;
      background: #166534;
      color: #dcfce7;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <h1>DevOps диплом: Андрей</h1>
    <p>Приложение успешно собрано и запущено в Docker-контейнере.</p>
    <span class="status">DEPLOYMENT SUCCESSFUL</span>
  </main>
</body>
</html>
